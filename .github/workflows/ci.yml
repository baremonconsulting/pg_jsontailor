name: PostgreSQL test matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compile Python tools
        run: python3 -m compileall -q bench pilot tests tools

      - name: Verify extension SQL
        run: python3 tools/verify_extension_sql.py

      - name: Verify repository consistency
        run: |
          python3 tools/verify_test_coverage.py
          python3 tools/verify_repository_consistency.py
          python3 tests/tooling_regressions.py
          python3 tests/mixed_type_regressions.py
          python3 pilot/synthetic/test_runner.py
          python3 tests/documentation_regressions.py
          python3 tests/rc02_benchmark_regressions.py
          python3 tools/verify_generated_sql_notice.py
          python3 -m unittest discover -s tests -p '*trust_regressions.py'
          python3 tools/verify_release_candidate.py
          python3 tools/verify_test_coverage.py \
            --scope repository \
            --passed-suite repository \
            --output "$RUNNER_TEMP/repository-coverage.json"

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          ! git grep -nE '[[:space:]]+$' -- '*.md' '*.py' '*.sql' '*.yml' '*.yaml'
          ! git ls-files | grep -E '(^|/)(__pycache__|results|\.run|\.tools)(/|$)'

  postgres:
    name: PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['17', '18', '19']
    env:
      PGHOST: ${{ github.workspace }}/.pgsocket
      PGPORT: '55432'
      PGUSER: runner
      PGDATABASE: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set PostgreSQL paths
        run: |
          echo "PG_CONFIG=$RUNNER_TEMP/pgsql/bin/pg_config" >> "$GITHUB_ENV"
          echo "PGBIN=$RUNNER_TEMP/pgsql/bin" >> "$GITHUB_ENV"

      - name: Install PostgreSQL ${{ matrix.postgresql }} packages
        timeout-minutes: 9
        if: matrix.postgresql != '19'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/install_postgresql.py "${{ matrix.postgresql }}" \
            --log "$RUNNER_TEMP/installation.log" --job-minutes 45
          ln -s "/usr/lib/postgresql/${{ matrix.postgresql }}" "$RUNNER_TEMP/pgsql"
      - name: Build PostgreSQL 19 release candidate
        timeout-minutes: 15
        if: matrix.postgresql == '19'
        shell: bash
        run: |
          set -euo pipefail
          {
          archive="$RUNNER_TEMP/postgresql-19rc1.tar.bz2"
          source_dir="$RUNNER_TEMP/postgresql-19rc1"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --connect-timeout 20 -fsSL \
            https://ftp.postgresql.org/pub/source/v19rc1/postgresql-19rc1.tar.bz2 \
            -o "$archive"
          echo 'af105fc8e960fc836a09fc2cd7f582b49fd17675d9d36631abe3a565bfd7d701  '"$archive" \
            | sha256sum --check --strict
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./configure \
            --prefix="$RUNNER_TEMP/pgsql" \
            --without-icu \
            --without-readline \
            --without-zlib
          make -s -j2
          make -s install
          } 2>&1 | tee "$RUNNER_TEMP/installation.log"

      - name: Start isolated PostgreSQL instance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PGHOST" "$RUNNER_TEMP/pgdata"
          "$PGBIN/initdb" --auth=trust --encoding=UTF8 --no-locale -D "$RUNNER_TEMP/pgdata"
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" \
            -o "-F -k $PGHOST -p $PGPORT" \
            -l "$RUNNER_TEMP/postgresql.log" start

      - name: Install extension files with PGXS
        shell: bash
        run: |
          set -euo pipefail
          make PG_CONFIG="$PG_CONFIG"
          sudo make PG_CONFIG="$PG_CONFIG" install

      - name: Run regression and isolation tests
        run: make PG_CONFIG="$PG_CONFIG" installcheck

      - name: Run functional and security suites
        shell: bash
        run: |
          set -euo pipefail
          "$PGBIN/createdb" jsontailor_ci
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -d jsontailor_ci \
            -c 'CREATE EXTENSION pg_jsontailor'
          "$PGBIN/psql" -X -v ON_ERROR_STOP=1 -d jsontailor_ci \
            -f tests/verify_installation.sql
          python3 tests/installation_checker_regressions.py \
            --psql "$PGBIN/psql" --database jsontailor_ci
          python3 tests/core_operations.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --schema examples/shop_schema.sql \
            --spec examples/orders_dv.spec.json \
            --output "$RUNNER_TEMP/core-results.jsonl"
          python3 tests/validation_security.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --schema examples/shop_schema.sql \
            --spec examples/orders_dv.spec.json \
            --output "$RUNNER_TEMP/validation-results.jsonl"
          python3 tests/integrity_repeatability.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/integrity-results.jsonl" \
            --repeatability-output "$RUNNER_TEMP/repeatability-results.jsonl"
          python3 tests/subtransaction_regressions.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/subtransaction-results.jsonl"
          python3 tests/setbased_reconciliation.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --schema examples/shop_schema.sql \
            --spec examples/orders_dv.spec.json \
            --output "$RUNNER_TEMP/setbased-results.json"
          python3 tests/merge_operations.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/merge-results.jsonl"
          python3 tests/mapped_type_matrix.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/type-results.jsonl"
          python3 tests/document_shape_matrix.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/shape-results.jsonl"
          python3 tests/security_contract_matrix.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/security-results.jsonl"
          python3 tests/partition_lifecycle_matrix.py \
            --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --output "$RUNNER_TEMP/partition-results.jsonl"
          python3 tests/helper_acl_matrix.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --result "$RUNNER_TEMP/helper-acl-results.jsonl"
          python3 tests/runtime_limits_matrix.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --result "$RUNNER_TEMP/runtime-limits-results.jsonl"
          python3 tests/rc02_database_regressions.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --result "$RUNNER_TEMP/rc02-database-results.jsonl"
          python3 tests/rc02_read_qualification.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --output "$RUNNER_TEMP/rc02-read-results.jsonl"
          python3 tools/verify_jsonl_results.py \
            "$RUNNER_TEMP/core-results.jsonl" \
            "$RUNNER_TEMP/validation-results.jsonl" \
            "$RUNNER_TEMP/integrity-results.jsonl" \
            "$RUNNER_TEMP/repeatability-results.jsonl" \
            "$RUNNER_TEMP/subtransaction-results.jsonl" \
            "$RUNNER_TEMP/merge-results.jsonl" \
            "$RUNNER_TEMP/type-results.jsonl" \
            "$RUNNER_TEMP/shape-results.jsonl" \
            "$RUNNER_TEMP/security-results.jsonl" \
            "$RUNNER_TEMP/partition-results.jsonl" \
            "$RUNNER_TEMP/helper-acl-results.jsonl" \
            "$RUNNER_TEMP/runtime-limits-results.jsonl" \
            "$RUNNER_TEMP/rc02-database-results.jsonl" \
            "$RUNNER_TEMP/rc02-read-results.jsonl"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/setbased-results.json"

      - name: Execute documentation and standalone generated SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/documentation_smoke.py --pg-bin "$PGBIN" \
            --output "$RUNNER_TEMP/docs-quickstart-results.jsonl"
          python3 tests/upgrade_documentation.py --pg-bin "$PGBIN" \
            --output "$RUNNER_TEMP/upgrade-docs-results.jsonl"
          python3 tests/public_contract.py --pg-bin "$PGBIN" \
            --output "$RUNNER_TEMP/public-contract-results.jsonl"
          python3 tests/standalone_generated_sql.py --pg-bin "$PGBIN" \
            --output "$RUNNER_TEMP/standalone-results.jsonl"
          python3 tools/verify_jsonl_results.py \
            "$RUNNER_TEMP/docs-quickstart-results.jsonl" \
            "$RUNNER_TEMP/upgrade-docs-results.jsonl" \
            "$RUNNER_TEMP/public-contract-results.jsonl" \
            "$RUNNER_TEMP/standalone-results.jsonl"

      - name: Retain documentation and standalone evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-docs-pg${{ matrix.postgresql }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/docs-quickstart-results.jsonl
            ${{ runner.temp }}/upgrade-docs-results.jsonl
            ${{ runner.temp }}/public-contract-results.jsonl
            ${{ runner.temp }}/standalone-results.jsonl

      - name: Verify custom and plain dump restore
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/dump_restore.py \
            --pg-bin "$PGBIN" \
            --maintenance-database postgres \
            --database-prefix jsontailor_dump_restore \
            --output "$RUNNER_TEMP/partition-restore-results.jsonl"
          python3 tests/dump_restore_matrix.py \
            --pg-bin "$PGBIN" \
            --bootstrap-database postgres \
            --database-prefix jsontailor_pgjt49 \
            --output "$RUNNER_TEMP/restore-matrix-results.jsonl"
          python3 tools/verify_jsonl_results.py \
            "$RUNNER_TEMP/partition-restore-results.jsonl" \
            "$RUNNER_TEMP/restore-matrix-results.jsonl"

      - name: Install pinned PostgREST 16.5
        if: matrix.postgresql == '18' || github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/postgrest-v16.5-linux-static-x86-64.tar.xz"
          if ! curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --connect-timeout 20 -fsSL \
            https://github.com/PostgREST/postgrest/releases/download/v16.5/postgrest-v16.5-linux-static-x86-64.tar.xz \
            -o "$archive"; then
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
              --connect-timeout 20 -fsSL \
              -H 'Accept: application/octet-stream' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/PostgREST/postgrest/releases/assets/658320847 \
              -o "$archive"
          fi
          echo '5099e7ada38f9f6846cd87c14c5f158b7c165f1e9959665ad412e61f4dceba95  '"$archive" \
            | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/postgrest" --version | grep -Fx 'PostgREST 16.5'

      - name: Run PostgREST HTTP contract
        if: matrix.postgresql == '18' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$PGBIN/psql" -X -v spec="$(cat examples/orders_dv.spec.json)" \
            -d jsontailor_ci -f tests/setup_postgrest.sql
          mkdir -m 700 "$RUNNER_TEMP/postgrest-private"
          cat > "$RUNNER_TEMP/postgrest.conf" <<EOF
          db-uri = "postgresql://jt_postgrest_authenticator@127.0.0.1:${PGPORT}/jsontailor_ci"
          db-schemas = "api"
          db-max-rows = 1000
          db-anon-role = "jt_postgrest_anon"
          server-host = "127.0.0.1"
          server-port = 3052
          server-unix-socket = "$RUNNER_TEMP/postgrest-private/upstream.sock"
          server-unix-socket-mode = "600"
          admin-server-port = 3051
          log-level = "warn"
          EOF
          "$RUNNER_TEMP/postgrest" "$RUNNER_TEMP/postgrest.conf" \
            > "$RUNNER_TEMP/postgrest.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/postgrest.pid"
          for attempt in {1..80}; do
            curl -fsS http://127.0.0.1:3051/ready >/dev/null && break
            test "$attempt" -lt 80 || { echo 'PostgREST readiness failed; inspect encrypted diagnostics'; exit 1; }
            sleep 0.25
          done
          python3 tools/http_boundary.py \
            --upstream-socket "$RUNNER_TEMP/postgrest-private/upstream.sock" \
            --view orders_dv --view concurrent_dv --view fresh_acl_dv > "$RUNNER_TEMP/boundary.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/boundary.pid"
          for attempt in {1..80}; do
            curl -fsS http://127.0.0.1:3050/orders_dv >/dev/null && break
            test "$attempt" -lt 80 || exit 1
            sleep 0.25
          done
          python3 tests/run_postgrest.py \
            --transcript "$RUNNER_TEMP/postgrest-transcript.md" \
            --result "$RUNNER_TEMP/postgrest-results.jsonl"
          python3 tests/http_security_contract.py --psql "$PGBIN/psql" \
            --database jsontailor_ci \
            --upstream-socket "$RUNNER_TEMP/postgrest-private/upstream.sock" \
            --result "$RUNNER_TEMP/http-security-results.jsonl"
          python3 tests/http_boundary_regressions.py
          python3 tests/http_concurrency_contract.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --result "$RUNNER_TEMP/http-concurrency-results.jsonl"
          python3 pilot/synthetic/run_pilot.py \
            --pg-bin "$PGBIN" --postgrest "$RUNNER_TEMP/postgrest" \
            --database "jsontailor_synthetic_${{ matrix.postgresql }}" \
            --restore-database "jsontailor_synthetic_restore_${{ matrix.postgresql }}" \
            --output "$RUNNER_TEMP/synthetic-pilot" \
            --result "$RUNNER_TEMP/synthetic-pilot-results.jsonl"
          python3 tools/verify_jsonl_results.py "$RUNNER_TEMP/postgrest-results.jsonl" \
            "$RUNNER_TEMP/http-security-results.jsonl" "$RUNNER_TEMP/http-concurrency-results.jsonl" \
            "$RUNNER_TEMP/synthetic-pilot-results.jsonl"
          python3 tools/verify_test_coverage.py \
            --scope postgrest \
            --postgresql "${{ matrix.postgresql }}" \
            --result "postgrest=$RUNNER_TEMP/postgrest-results.jsonl" \
            --result "http_security=$RUNNER_TEMP/http-security-results.jsonl" \
            --result "http_concurrency=$RUNNER_TEMP/http-concurrency-results.jsonl" \
            --result "synthetic_pilot=$RUNNER_TEMP/synthetic-pilot-results.jsonl" \
            --output "$RUNNER_TEMP/postgrest-coverage.json"

      - name: Stop PostgREST
        if: always() && (matrix.postgresql == '18' || github.event_name == 'schedule')
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/boundary.pid" \
            || kill "$(cat "$RUNNER_TEMP/boundary.pid")" || true
          test ! -f "$RUNNER_TEMP/postgrest.pid" \
            || kill "$(cat "$RUNNER_TEMP/postgrest.pid")" \
            || true

      - name: Redact PostgREST evidence
        if: always() && (matrix.postgresql == '18' || github.event_name == 'schedule')
        run: |
          python3 tools/redact_results.py --suite postgrest \
            --input "$RUNNER_TEMP/postgrest-results.jsonl" \
            --output "$RUNNER_TEMP/postgrest-public-results.jsonl"
          python3 tools/redact_results.py --suite synthetic_pilot \
            --input "$RUNNER_TEMP/synthetic-pilot-results.jsonl" \
            --output "$RUNNER_TEMP/synthetic-pilot-public-results.jsonl"

      - name: Upload PostgREST evidence
        if: always() && (matrix.postgresql == '18' || github.event_name == 'schedule')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgrest-pg${{ matrix.postgresql }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/postgrest-public-results.jsonl
            ${{ runner.temp }}/synthetic-pilot-public-results.jsonl
            ${{ runner.temp }}/postgrest-coverage.json

      - name: Verify Jira-keyed runtime coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_test_coverage.py \
            --scope postgresql \
            --postgresql "${{ matrix.postgresql }}" \
            --result "core=$RUNNER_TEMP/core-results.jsonl" \
            --result "validation=$RUNNER_TEMP/validation-results.jsonl" \
            --result "integrity=$RUNNER_TEMP/integrity-results.jsonl" \
            --result "repeatability=$RUNNER_TEMP/repeatability-results.jsonl" \
            --result "subtransaction=$RUNNER_TEMP/subtransaction-results.jsonl" \
            --result "merge=$RUNNER_TEMP/merge-results.jsonl" \
            --result "types=$RUNNER_TEMP/type-results.jsonl" \
            --result "shapes=$RUNNER_TEMP/shape-results.jsonl" \
            --result "security=$RUNNER_TEMP/security-results.jsonl" \
            --result "helper_acl=$RUNNER_TEMP/helper-acl-results.jsonl" \
            --result "runtime_limits=$RUNNER_TEMP/runtime-limits-results.jsonl" \
            --result "rc02_database=$RUNNER_TEMP/rc02-database-results.jsonl" \
            --result "rc02_read=$RUNNER_TEMP/rc02-read-results.jsonl" \
            --result "partitions=$RUNNER_TEMP/partition-results.jsonl" \
            --result "partition_restore=$RUNNER_TEMP/partition-restore-results.jsonl" \
            --result "restore_matrix=$RUNNER_TEMP/restore-matrix-results.jsonl" \
            --result "docs_quickstart=$RUNNER_TEMP/docs-quickstart-results.jsonl" \
            --result "upgrade_docs=$RUNNER_TEMP/upgrade-docs-results.jsonl" \
            --result "public_contract=$RUNNER_TEMP/public-contract-results.jsonl" \
            --result "standalone=$RUNNER_TEMP/standalone-results.jsonl" \
            --passed-suite installcheck \
            --passed-suite dump_restore \
            --output "$RUNNER_TEMP/coverage-pg${{ matrix.postgresql }}.json"

      - name: Require separate stale-return mutant witness
        run: |
          python3 tests/stale_return_mutant.py --psql "$PGBIN/psql" \
            --database jsontailor_ci --output "$RUNNER_TEMP/stale-return-results.jsonl"
          python3 tools/verify_jsonl_results.py "$RUNNER_TEMP/stale-return-results.jsonl"

      - name: Keep PostgreSQL diagnostics out of public job output
        if: failure()
        run: echo 'Full PostgreSQL and PostgREST diagnostics require protected operator retrieval.'

      - name: Stop PostgreSQL
        if: always()
        run: |
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -m fast stop || true

      - name: Collect and require complete exact-SHA evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIAGNOSTICS_CERTIFICATE: ${{ vars.EVIDENCE_DIAGNOSTICS_CERTIFICATE }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq '.id' || echo 0)"
          python3 tools/collect_evidence.py --kind ci --major "${{ matrix.postgresql }}" \
            --input "$RUNNER_TEMP" --repo . --workflow-id "$workflow_id" \
            --output "$RUNNER_TEMP/evidence/ci-pg${{ matrix.postgresql }}"

      - name: Retain redacted PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgresql-${{ matrix.postgresql }}-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/evidence/ci-pg${{ matrix.postgresql }}/bundle.json
            ${{ runner.temp }}/evidence/ci-pg${{ matrix.postgresql }}/public/

      - name: Retain encrypted PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgresql-${{ matrix.postgresql }}-diagnostics
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/evidence/ci-pg${{ matrix.postgresql }}/diagnostics/
