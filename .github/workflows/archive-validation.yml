name: Extracted release archive validation

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  archive:
    name: Archive PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['17', '18', '19']
    env:
      PGHOST: ${{ github.workspace }}/.archive-pgsocket
      PGPORT: '55432'
      PGUSER: runner
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: package
      - name: Install PostgreSQL 17 or 18
        if: matrix.postgresql != '19'
        timeout-minutes: 9
        env:
          MAJOR: ${{ matrix.postgresql }}
        run: |
          python3 tools/install_postgresql.py "$MAJOR" --log "$RUNNER_TEMP/installation.log"
          echo "PGBIN=/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_ENV"
      - name: Build PostgreSQL 19 release candidate
        if: matrix.postgresql == '19'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 -fsSL \
            https://ftp.postgresql.org/pub/source/v19rc1/postgresql-19rc1.tar.bz2 -o "$RUNNER_TEMP/pg19.tar.bz2"
          echo 'af105fc8e960fc836a09fc2cd7f582b49fd17675d9d36631abe3a565bfd7d701  '"$RUNNER_TEMP/pg19.tar.bz2" | sha256sum --check --strict
          tar -xjf "$RUNNER_TEMP/pg19.tar.bz2" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/postgresql-19rc1"
          ./configure --prefix="$RUNNER_TEMP/pgsql" --without-icu --without-readline --without-zlib
          make -s -j2
          make -s install
          echo "PGBIN=$RUNNER_TEMP/pgsql/bin" >> "$GITHUB_ENV"
      - name: Start disposable cluster
        run: |
          set -euo pipefail
          mkdir -p "$PGHOST"
          "$PGBIN/initdb" --auth=trust --encoding=UTF8 --no-locale -D "$RUNNER_TEMP/pgdata"
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -o "-F -k $PGHOST -p $PGPORT" -l "$RUNNER_TEMP/postgresql.log" start
      - name: Verify and test extracted archive only
        run: |
          set -euo pipefail
          archive="$(find package -maxdepth 1 -name '*.tar.gz' -type f)"
          test "$(printf '%s\n' "$archive" | wc -l)" = 1
          checksum="$(cut -d ' ' -f1 "$archive.sha256")"
          python3 tools/archive_rehearsal.py --archive "$archive" --sha "$GITHUB_SHA" \
            --checksum "$checksum" --pg-bin "$PGBIN" --output "$RUNNER_TEMP/archive-evidence"
      - name: Stop cluster
        if: always()
        run: '"$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -m fast stop || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: archive-pg${{ matrix.postgresql }}
          if-no-files-found: error
          path: ${{ runner.temp }}/archive-evidence/
