name: Nightly generated SQL assurance
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-generated-sql
  cancel-in-progress: true
jobs:
  pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PGHOST: ${{ github.workspace }}/.pgsocket
      PGPORT: '55432'
      PGUSER: runner
      PGDATABASE: jsontailor_nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -fsSL \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends postgresql-18 postgresql-server-dev-18
      - name: Start isolated database and install extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PGHOST" "$RUNNER_TEMP/pgdata"
          /usr/lib/postgresql/18/bin/initdb --auth=trust --encoding=UTF8 --no-locale -D "$RUNNER_TEMP/pgdata"
          /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/pgdata" -o "-F -k $PGHOST -p $PGPORT" -l "$RUNNER_TEMP/postgresql.log" start
          make PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config
          sudo make PG_CONFIG=/usr/lib/postgresql/18/bin/pg_config install
          /usr/lib/postgresql/18/bin/createdb "$PGDATABASE"
          /usr/lib/postgresql/18/bin/psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_jsontailor'
      - name: Run bounded campaign
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/property_generated_sql.py --psql /usr/lib/postgresql/18/bin/psql \
            --database "$PGDATABASE" --seed 50050 --cases 24 \
            --output "$RUNNER_TEMP/property-generated-sql.jsonl"
          python3 tests/mutate_generated_sql.py --psql /usr/lib/postgresql/18/bin/psql \
            --database "$PGDATABASE" --repo . \
            --output "$RUNNER_TEMP/mutation-generated-sql.jsonl"
          python3 tools/verify_jsonl_results.py "$RUNNER_TEMP/property-generated-sql.jsonl" \
            "$RUNNER_TEMP/mutation-generated-sql.jsonl"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-sql-pg18
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/property-generated-sql.jsonl
            ${{ runner.temp }}/mutation-generated-sql.jsonl
            ${{ runner.temp }}/postgresql.log
      - name: Require complete evidence
        if: always()
        shell: bash
        run: |
          test -s "$RUNNER_TEMP/property-generated-sql.jsonl"
          test -s "$RUNNER_TEMP/mutation-generated-sql.jsonl"
      - name: Stop PostgreSQL
        if: always()
        run: /usr/lib/postgresql/18/bin/pg_ctl -D "$RUNNER_TEMP/pgdata" -m fast stop || true
