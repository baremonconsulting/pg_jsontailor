name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  checks: read

jobs:
  release:
    name: Publish source release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag and package source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/^default_version = '\([^']*\)'/\1/p" pg_jsontailor.control)
          test "$GITHUB_REF_NAME" = "v$version"
          required_checks=(
            'Repository checks'
            'PostgreSQL 17'
            'PostgreSQL 18'
            'PostgreSQL 19'
            'CodeQL (Python)'
            'Dependency review'
          )
          check_runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name,.status,.conclusion] | @tsv')
          for required in "${required_checks[@]}"; do
            awk -F '\t' -v name="$required" \
              '$1==name && $2=="completed" && $3=="success" {found=1} END {exit !found}' \
              <<<"$check_runs"
          done
          archive="pg_jsontailor-$version.tar.gz"
          git archive --format=tar.gz --prefix="pg_jsontailor-$version/" \
            -o "$archive" "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --verify-tag \
            --generate-notes \
            --title "pg_jsontailor $GITHUB_REF_NAME"
