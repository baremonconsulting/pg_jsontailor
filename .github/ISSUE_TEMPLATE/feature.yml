name: Feature request
description: Propose a focused extension to the supported document model.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the migration or integration problem without customer-identifying information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
      description: Include effects on ETags, RLS, generated DDL and PostgreSQL versions where relevant.
